name: Update Daily Thanthi Filtered Feed

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs automatically every 3 hours
  workflow_dispatch:       # Allows manual trigger via GitHub Actions tab

permissions:
  contents: write

jobs:
  filter-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run feed filter
        run: python filter_feed.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || (git commit -m "chore: update feed.xml" && git push)
